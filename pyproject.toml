[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "fileconverter"
version = "0.1.0"
description = "Local-first desktop file converter"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "Pillow>=11.0",
    # Only QtCore/QtGui/QtWidgets are needed; the full "PySide6" metapackage would also
    # pull in WebEngine and other large add-ons.
    "PySide6-Essentials>=6.8",
    # Documents: pure-Python, permissive licenses. 1.13 includes mammoth's security fixes
    # (no external file access by default, Windows path traversal, ReDoS).
    "mammoth>=1.13",
    "openpyxl>=3.1.5",
    # PDF rendering and creation (ctypes bindings to the bundled PDFium library).
    "pypdfium2>=5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-qt>=4.4",
    "ruff>=0.6",
]

[project.scripts]
fileconverter = "fileconverter.cli:main"

[project.gui-scripts]
fileconverter-gui = "fileconverter.gui.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
qt_api = "pyside6"

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # import sorting
    "B",   # bugbear: likely bugs
    "UP",  # pyupgrade: modern syntax
    "SIM", # simplifications
]
